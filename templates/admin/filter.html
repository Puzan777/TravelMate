{% load i18n %}
<div class="tm-filter-group">
    <label class="tm-filter-label">{{ title }}</label>
    <select class="tm-filter-select" onchange="window.location.href=this.value">
      {% for choice in choices %}
        <option value="{{ choice.query_string|iriencode }}" {% if choice.selected %}selected{% endif %}>
          {{ choice.display|truncatechars:40 }}
        </option>
      {% endfor %}
    </select>
</div>
