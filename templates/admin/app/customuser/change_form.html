{% extends "admin/change_form.html" %}
{% load i18n %}

{% block extrastyle %}
{{ block.super }}
<style>
  .tm-sticky-back-row {
    position: sticky;
    bottom: 12px;
    z-index: 55;
    border: 0 !important;
    border-radius: 0;
    background: transparent !important;
    box-shadow: none;
    backdrop-filter: none;
    padding: 0 !important;
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
  }

  .tm-sticky-back-row .button {
    box-shadow: 0 6px 14px rgba(15, 118, 110, 0.24);
  }
</style>
{% endblock %}

{% block object-tools %}{% endblock %}

{% block submit_buttons_top %}{% endblock %}

{% block submit_buttons_bottom %}
<div class="submit-row tm-sticky-back-row">
  <a href="{% url 'admin:app_customuser_changelist' %}" class="button" style="background:#0f766e;border-color:#0f766e;color:#fff;">Back to Users</a>
</div>
{% endblock %}
