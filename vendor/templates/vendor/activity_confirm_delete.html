{% extends 'base.html' %}

{% block title %}Delete Activity{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Delete Activity</h1>
      <p class="mb-3">Are you sure you want to delete <strong>{{ activity.name }}</strong>?</p>
      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <a href="{% url 'vendor:activity_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete Activity</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
